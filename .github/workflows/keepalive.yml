name: Supabase keep-alive

# Free-tier Supabase projects pause after ~1 week of low activity.
# A daily ping keeps the project active. (Supabase counts "low"
# activity, not zero — docs suggest a few requests per day, so we
# ping daily. Minute 17 avoids GitHub's congested minute-0 slot.)
# The publishable key is safe to expose — RLS protects the data
# (same key already shipped in config.js).

on:
  schedule:
    - cron: "17 12 * * *" # daily, 12:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS --fail -o /dev/null --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_jtfOGXG9ejm1DoeflNLLLw_UnFhmkBH" \
            "https://vaxltvzsqbedvjtoljnz.supabase.co/rest/v1/app_state?select=updated_at&limit=1"
